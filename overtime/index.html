<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonus Tracker</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --surface-color: #ffffff;
            --text-main: #333333;
            --text-muted: #888888;
            --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.1);
            --accent: #4A90E2;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button {
            background: var(--surface-color);
            border: 1px solid #eee;
            padding: 0.55rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        button:hover { box-shadow: var(--shadow-soft); }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
        }

        /* Top 3 Full-Width Action Buttons */
        .top-actions-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            width: 100%;
        }

        .top-action-btn {
            width: 100%;
            padding: 0.9rem 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            background: var(--surface-color);
            border: 1px solid #eaeaea;
            box-shadow: var(--shadow-soft);
        }
        .top-action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: var(--shadow-hover);
        }
        .top-action-btn.primary-action {
            background: var(--text-main);
            color: #ffffff;
            border-color: var(--text-main);
        }
        .top-action-btn.primary-action:hover {
            background: #000000;
            color: #ffffff;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .top-actions-bar { grid-template-columns: 1fr; }
            .banks-grid { grid-template-columns: 1fr !important; }
        }

        @media (max-width: 1024px) {
            .banks-grid { grid-template-columns: 1fr 1fr !important; }
        }

        .panel {
            background: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
        }

        /* Quick Add Buttons (Larger, Centered Text, Larger Icons) */
        .quick-adds-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .generator {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 0.45rem;
            min-width: 145px;
            padding: 1rem 1.2rem;
            background: #fafafa;
            border: 2px dashed #e0e0e0;
            border-radius: 12px;
            cursor: grab;
            transition: all 0.2s;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }
        .generator:active { cursor: grabbing; border-color: var(--accent); }
        .generator:hover { background: #ffffff; border-color: #d0d0d0; box-shadow: var(--shadow-soft); }

        .generator .icon-img {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            pointer-events: none;
        }

        .generator-text-title {
            font-weight: 600;
            font-size: 1rem;
            pointer-events: none;
            color: var(--text-main);
        }

        .generator-text-value {
            color: var(--accent);
            font-size: 1.05rem;
            font-weight: 700;
            pointer-events: none;
        }

        .generator-actions {
            position: absolute;
            top: 0.4rem;
            right: 0.4rem;
            display: flex;
            gap: 0.2rem;
        }
        .generator-actions button {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #f0f0f0;
            box-shadow: none;
            padding: 0.2rem 0.35rem;
            border-radius: 6px;
            font-size: 0.72rem;
            line-height: 1;
            color: var(--text-muted);
        }
        .generator-actions button:hover {
            color: var(--text-main);
            background: #ebebeb;
        }

        .icon-img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.8rem; width: 100%; }
        .row-group { display: flex; gap: 0.8rem; width: 100%; align-items: center; }

        input, select, textarea {
            padding: 0.75rem;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            background: #fafafa;
            width: 100%;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: -0.35rem;
        }

        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            width: 100%;
        }
        .file-upload-btn {
            background: #f0f4f8;
            color: var(--accent);
            border: 1px dashed var(--accent);
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            flex: 1;
            transition: background 0.2s;
        }
        .file-upload-btn:hover { background: #e1ecf8; }
        input[type="file"] { display: none; }

        .btn-primary { background: var(--text-main); color: white; border: none; padding: 0.8rem 1rem; }
        .btn-primary:hover { background: #000; }
        .btn-secondary { background: var(--surface-color); padding: 0.45rem 0.8rem; font-size: 0.85rem; }
        .btn-danger { background: #ffebee; color: #c62828; border: none; padding: 0.6rem 0.9rem; font-size: 0.85rem; font-weight: 600; }
        .btn-danger:hover { background: #ffcdd2; box-shadow: none; }

        /* Banks Grid */
        .banks-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }
        .bank {
            background: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-soft);
            min-height: 300px;
            border: 2px solid transparent;
            transition: border 0.2s, background 0.2s;
        }
        .bank.drag-over { border-color: var(--accent); background: #f4f9ff; }
        .bank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .person-name-btn {
            background: none;
            border: none;
            box-shadow: none;
            padding: 0;
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
        }
        .person-name-btn:hover {
            color: var(--accent);
            box-shadow: none;
        }
        .total { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

        .item-list { list-style: none; padding: 0; margin: 0; }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .item:last-child { border-bottom: none; }
        .item-details { display: flex; align-items: center; gap: 1rem; flex: 1; }
        .item-icon {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            object-fit: cover;
            background: #ffffff;
            border: 1px solid #f0f0f0;
            flex-shrink: 0;
        }
        .item-info { display: flex; flex-direction: column; gap: 0.15rem; }
        .item-title-btn {
            background: none;
            border: none;
            box-shadow: none;
            padding: 0;
            margin: 0;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
        }
        .item-title-btn:hover {
            color: var(--accent);
            text-decoration: underline;
            box-shadow: none;
        }
        .item-val { color: var(--text-main); font-size: 0.92rem; font-weight: 500; }
        .item-meta-tiny {
            color: var(--text-muted);
            font-size: 0.72rem;
            line-height: 1.25;
        }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.25); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 20;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; padding: 2rem; border-radius: var(--border-radius);
            box-shadow: var(--shadow-hover); width: 100%; max-width: 400px;
        }
        .modal h3 { margin-top: 0; margin-bottom: 1rem; }
        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }
        .modal-actions-right {
            display: flex;
            gap: 0.75rem;
            margin-left: auto;
        }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- Top 3 Full-Width Buttons -->
        <div class="top-actions-bar">
            <button type="button" class="top-action-btn" id="btn-open-add-person">Add Person</button>
            <button type="button" class="top-action-btn" id="btn-open-quickadd-new">Add Button</button>
            <button type="button" class="top-action-btn primary-action" id="btn-open-custom-bonus">Custom Bonus</button>
        </div>

        <!-- Quick Add Drag/Drop Area -->
        <div class="panel">
            <div class="quick-adds-container" id="quick-adds-container"></div>
        </div>

        <!-- Banks Grid -->
        <div class="banks-grid" id="banks-grid-container"></div>
    </div>

    <!-- 1. Add Person Modal -->
    <div class="modal-overlay" id="modal-add-person">
        <div class="modal">
            <h3>Add Person</h3>
            <div class="form-group">
                <label for="new-person-name">Person's Name</label>
                <input type="text" id="new-person-name" placeholder="Person's Name...">
            </div>
            <div class="modal-actions">
                <div class="modal-actions-right">
                    <button type="button" id="btn-close-add-person">Cancel</button>
                    <button type="button" class="btn-primary" id="btn-confirm-add-person">Add Person</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. Manage Person Details Modal (on clicking person's name) -->
    <div class="modal-overlay" id="modal-manage-person">
        <div class="modal">
            <h3>Manage Person</h3>
            <div class="form-group">
                <input type="hidden" id="manage-person-old-name">
                <label for="manage-person-name">Name</label>
                <input type="text" id="manage-person-name">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-danger" id="btn-confirm-delete-person">Delete</button>
                <div class="modal-actions-right">
                    <button type="button" id="btn-close-manage-person">Cancel</button>
                    <button type="button" class="btn-primary" id="btn-save-manage-person">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. Custom Bonus Modal -->
    <div class="modal-overlay" id="modal-custom-bonus">
        <div class="modal">
            <h3>Custom Bonus</h3>
            <div class="form-group">
                <div style="display:flex; gap:0.9rem; align-items:center;">
                    <img id="img-custom-preview" class="icon-img" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Custom icon">
                    <input type="text" id="custom-title" placeholder="e.g. Gift, Reward">
                </div>
                <div class="row-group">
                    <input type="number" id="custom-amount" placeholder="Amount (£)" step="any" min="0">
                    <select id="custom-user"></select>
                </div>
                <label for="custom-date">Date</label>
                <input type="date" id="custom-date">
                <label for="custom-note">Note (optional)</label>
                <input type="text" id="custom-note" placeholder="Short note about this bonus...">
                <div class="file-upload-wrapper">
                    <label class="file-upload-btn" for="custom-img-file">📁 Upload Icon (Stored in DB)</label>
                    <input type="file" id="custom-img-file" accept="image/*">
                    <button type="button" class="btn-secondary" id="btn-clear-custom-img" style="display:none;">Clear</button>
                </div>
            </div>
            <div class="modal-actions">
                <div class="modal-actions-right">
                    <button type="button" id="btn-close-custom-bonus">Cancel</button>
                    <button type="button" class="btn-primary" id="btn-add-custom">Add to Bank</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. Edit/Create Quick Add Button Modal -->
    <div class="modal-overlay" id="modal-quickadd">
        <div class="modal">
            <h3 id="modal-quickadd-title">Add Quick Button</h3>
            <div class="form-group">
                <input type="hidden" id="qa-edit-id">
                <label for="qa-title">Title</label>
                <input type="text" id="qa-title" placeholder="e.g. Pocket Money">
                <label for="qa-amount">Amount (£)</label>
                <input type="number" id="qa-amount" placeholder="5" step="any">
                <label for="qa-note">Default Note (optional)</label>
                <input type="text" id="qa-note" placeholder="Optional short note...">
                <label>Icon Image</label>
                <div class="file-upload-wrapper">
                    <img id="qa-img-preview" class="icon-img" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Preview">
                    <label class="file-upload-btn" for="qa-img-file">📁 Choose Image File</label>
                    <input type="file" id="qa-img-file" accept="image/*">
                    <button type="button" class="btn-secondary" id="btn-clear-qa-img" style="display:none;">Clear</button>
                </div>
            </div>
            <div class="modal-actions">
                <div class="modal-actions-right">
                    <button type="button" id="btn-close-quickadd">Cancel</button>
                    <button type="button" class="btn-primary" id="btn-save-quickadd">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 5. Edit Bonus Modal (opened by clicking bonus name, includes Delete button) -->
    <div class="modal-overlay" id="modal-edit">
        <div class="modal">
            <h3>Edit Bonus</h3>
            <div class="form-group">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-user">
                <label for="edit-title">Title</label>
                <input type="text" id="edit-title">
                <label for="edit-amount">Amount (£)</label>
                <input type="number" id="edit-amount" step="any">
                <label for="edit-date">Date</label>
                <input type="date" id="edit-date">
                <label for="edit-note">Note (optional)</label>
                <input type="text" id="edit-note" placeholder="Short note...">
                <label>Icon Image</label>
                <div class="file-upload-wrapper">
                    <img id="edit-img-preview" class="icon-img" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Preview">
                    <label class="file-upload-btn" for="edit-img-file">📁 Change Image</label>
                    <input type="file" id="edit-img-file" accept="image/*">
                    <button type="button" class="btn-secondary" id="btn-clear-edit-img" style="display:none;">Clear</button>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-danger" id="btn-delete-edit-item">Delete</button>
                <div class="modal-actions-right">
                    <button type="button" id="btn-close-edit">Cancel</button>
                    <button type="button" class="btn-primary" id="btn-save-edit">Update</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getDatabase, ref, onValue, push, set, remove, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxKv-xXahSO2TEtwVwXTfU1eJ1ZsaaMAc",
            authDomain: "tasks-de4d9.firebaseapp.com",
            databaseURL: "https://tasks-de4d9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tasks-de4d9",
            storageBucket: "tasks-de4d9.firebasestorage.app",
            messagingSenderId: "908733856196",
            appId: "1:908733856196:web:b8d268a692a0e079be4c91"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let itemsUnsubscribes = {};
        let quickAddsCache = {};
        let bankItemsCache = {};
        const emptyImage = "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=";

        let customBase64Img = "";
        let qaBase64Img = "";
        let editBase64Img = "";

        const quickAddsContainer = document.getElementById('quick-adds-container');
        const customTitle = document.getElementById('custom-title');
        const customAmount = document.getElementById('custom-amount');
        const customUser = document.getElementById('custom-user');
        const customDate = document.getElementById('custom-date');
        const customNote = document.getElementById('custom-note');
        const customImgFile = document.getElementById('custom-img-file');
        const customImgPreview = document.getElementById('img-custom-preview');
        const btnClearCustomImg = document.getElementById('btn-clear-custom-img');

        function getTodayISO() {
            const now = new Date();
            const offset = now.getTimezoneOffset();
            const localDate = new Date(now.getTime() - offset * 60000);
            return localDate.toISOString().split('T')[0];
        }

        function formatDisplayDate(isoDate) {
            if (!isoDate) return "";
            const parts = isoDate.split('-');
            if (parts.length !== 3) return isoDate;
            const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        /* -------------------------------------------
           BASE64 ICON COMPRESSION FOR FIREBASE RTDB
        -------------------------------------------- */
        function compressImageToBase64(file, maxSize = 112) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = maxSize;
                        canvas.height = maxSize;
                        const ctx = canvas.getContext('2d');

                        const minSide = Math.min(img.width, img.height);
                        const sx = (img.width - minSide) / 2;
                        const sy = (img.height - minSide) / 2;

                        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, maxSize, maxSize);
                        resolve(canvas.toDataURL('image/webp', 0.85));
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Custom Bonus file bindings
        customImgFile.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            customBase64Img = await compressImageToBase64(file);
            customImgPreview.src = customBase64Img;
            btnClearCustomImg.style.display = 'inline-block';
        });

        btnClearCustomImg.addEventListener('click', () => {
            customBase64Img = "";
            customImgFile.value = "";
            customImgPreview.src = emptyImage;
            btnClearCustomImg.style.display = 'none';
        });

        // Quick Add file bindings
        const qaImgFile = document.getElementById('qa-img-file');
        const qaImgPreview = document.getElementById('qa-img-preview');
        const btnClearQaImg = document.getElementById('btn-clear-qa-img');

        qaImgFile.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            qaBase64Img = await compressImageToBase64(file);
            qaImgPreview.src = qaBase64Img;
            btnClearQaImg.style.display = 'inline-block';
        });

        btnClearQaImg.addEventListener('click', () => {
            qaBase64Img = "";
            qaImgFile.value = "";
            qaImgPreview.src = emptyImage;
            btnClearQaImg.style.display = 'none';
        });

        // Edit Bonus file bindings
        const editImgFile = document.getElementById('edit-img-file');
        const editImgPreview = document.getElementById('edit-img-preview');
        const btnClearEditImg = document.getElementById('btn-clear-edit-img');

        editImgFile.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            editBase64Img = await compressImageToBase64(file);
            editImgPreview.src = editBase64Img;
            btnClearEditImg.style.display = 'inline-block';
        });

        btnClearEditImg.addEventListener('click', () => {
            editBase64Img = "";
            editImgFile.value = "";
            editImgPreview.src = emptyImage;
            btnClearEditImg.style.display = 'none';
        });

        /* -------------------------------------------
           FIREBASE INITIALIZATION
        -------------------------------------------- */
        signInAnonymously(auth).then(() => {
            initApp();
        }).catch((error) => {
            console.error("Auth Error:", error);
            alert("Authentication failed. Check console.");
        });

        function initApp() {
            onValue(ref(db, 'quickAdds'), (snapshot) => {
                quickAddsCache = snapshot.val() || {};
                renderQuickAdds(quickAddsCache);
            });

            get(ref(db, 'users')).then(snap => {
                const existingUsers = snap.val() || {};
                const names = Object.keys(existingUsers);
                if (names.length > 0) {
                    names.forEach(n => set(ref(db, `people/${n}`), true));
                } else {
                    set(ref(db, 'people/Christopher'), true);
                    set(ref(db, 'people/Renata'), true);
                }
            });

            onValue(ref(db, 'people'), (snapshot) => {
                const peopleObj = snapshot.val() || {};
                const peopleNames = Object.keys(peopleObj);
                renderBanksGridAndSelect(peopleNames);
            });
        }

        /* -------------------------------------------
           TOP BAR MODALS (ADD PERSON & CUSTOM BONUS)
        -------------------------------------------- */
        const modalAddPerson = document.getElementById('modal-add-person');
        const newPersonInput = document.getElementById('new-person-name');

        document.getElementById('btn-open-add-person').addEventListener('click', () => {
            newPersonInput.value = "";
            modalAddPerson.classList.add('active');
            setTimeout(() => newPersonInput.focus(), 50);
        });

        document.getElementById('btn-close-add-person').addEventListener('click', () => {
            modalAddPerson.classList.remove('active');
        });

        document.getElementById('btn-confirm-add-person').addEventListener('click', () => {
            const name = newPersonInput.value.trim();
            if (name) {
                set(ref(db, `people/${name}`), true);
                newPersonInput.value = "";
                modalAddPerson.classList.remove('active');
            }
        });

        const modalCustomBonus = document.getElementById('modal-custom-bonus');

        document.getElementById('btn-open-custom-bonus').addEventListener('click', () => {
            customTitle.value = "";
            customAmount.value = "";
            customDate.value = getTodayISO();
            customNote.value = "";
            customBase64Img = "";
            customImgFile.value = "";
            customImgPreview.src = emptyImage;
            btnClearCustomImg.style.display = 'none';
            modalCustomBonus.classList.add('active');
        });

        document.getElementById('btn-close-custom-bonus').addEventListener('click', () => {
            modalCustomBonus.classList.remove('active');
        });

        document.getElementById('btn-add-custom').addEventListener('click', () => {
            const title = customTitle.value.trim();
            const amount = parseFloat(customAmount.value);
            const user = customUser.value;
            const date = customDate.value || getTodayISO();
            const note = customNote.value.trim();

            if (title && !isNaN(amount) && user) {
                addBonus(user, title, amount, customBase64Img, date, note);
                modalCustomBonus.classList.remove('active');
            } else {
                alert("Please ensure title, amount, and person are provided.");
            }
        });

        /* -------------------------------------------
           MANAGE PERSON MODAL
        -------------------------------------------- */
        const modalManagePerson = document.getElementById('modal-manage-person');
        const managePersonOldName = document.getElementById('manage-person-old-name');
        const managePersonName = document.getElementById('manage-person-name');

        function openManagePerson(name) {
            managePersonOldName.value = name;
            managePersonName.value = name;
            modalManagePerson.classList.add('active');
        }

        document.getElementById('btn-close-manage-person').addEventListener('click', () => {
            modalManagePerson.classList.remove('active');
        });

        document.getElementById('btn-save-manage-person').addEventListener('click', async () => {
            const oldName = managePersonOldName.value;
            const newName = managePersonName.value.trim();
            if (!newName) return;

            if (newName !== oldName) {
                const itemsSnap = await get(ref(db, `users/${oldName}/items`));
                const existingItems = itemsSnap.val();
                await set(ref(db, `people/${newName}`), true);
                if (existingItems) {
                    await set(ref(db, `users/${newName}/items`), existingItems);
                }
                await remove(ref(db, `people/${oldName}`));
                await remove(ref(db, `users/${oldName}`));
            }
            modalManagePerson.classList.remove('active');
        });

        document.getElementById('btn-confirm-delete-person').addEventListener('click', () => {
            const name = managePersonOldName.value;
            if (confirm(`Are you sure you want to completely remove ${name} and all their bonuses?`)) {
                remove(ref(db, `people/${name}`));
                remove(ref(db, `users/${name}`));
                modalManagePerson.classList.remove('active');
            }
        });

        /* -------------------------------------------
           QUICK ADDS LOGIC
        -------------------------------------------- */
        function renderQuickAdds(data) {
            quickAddsContainer.innerHTML = '';
            if (!data) return;

            Object.entries(data).forEach(([id, item]) => {
                const imgUrl = item.img || emptyImage;

                const div = document.createElement('div');
                div.className = 'generator draggable';
                div.draggable = true;
                div.dataset.id = id;

                div.innerHTML = `
                    <div class="generator-actions">
                        <button type="button" class="btn-edit-qa" data-id="${id}" title="Edit">✏️</button>
                        <button type="button" class="btn-del-qa" data-id="${id}" title="Delete">✕</button>
                    </div>
                    <img class="icon-img" src="${imgUrl}" alt="icon">
                    <div class="generator-text-title">${escapeHtml(item.title)}</div>
                    <div class="generator-text-value">£${item.amount}</div>
                `;
                quickAddsContainer.appendChild(div);
            });
        }

        quickAddsContainer.addEventListener('click', (e) => {
            const editBtn = e.target.closest('.btn-edit-qa');
            if (editBtn) {
                e.stopPropagation();
                const id = editBtn.dataset.id;
                const item = quickAddsCache[id];
                if (item) openEditQuickAdd(id, item);
                return;
            }

            const delBtn = e.target.closest('.btn-del-qa');
            if (delBtn) {
                e.stopPropagation();
                const id = delBtn.dataset.id;
                if (confirm("Delete this Quick Add button?")) {
                    remove(ref(db, `quickAdds/${id}`));
                }
            }
        });

        /* -------------------------------------------
           DESKTOP DRAG & MOBILE TOUCH DRAG
        -------------------------------------------- */
        let touchDragId = null;
        let touchDragClone = null;

        quickAddsContainer.addEventListener('dragstart', (e) => {
            const generator = e.target.closest('.generator');
            if (generator) {
                e.dataTransfer.setData('text/plain', generator.dataset.id);
                e.dataTransfer.effectAllowed = 'copy';
            }
        });

        quickAddsContainer.addEventListener('touchstart', (e) => {
            if (e.target.closest('.generator-actions')) return;

            const generator = e.target.closest('.generator');
            if (!generator) return;

            touchDragId = generator.dataset.id;

            touchDragClone = generator.cloneNode(true);
            touchDragClone.style.position = 'fixed';
            touchDragClone.style.pointerEvents = 'none';
            touchDragClone.style.zIndex = '9999';
            touchDragClone.style.opacity = '0.9';
            touchDragClone.style.transform = 'scale(1.05)';
            touchDragClone.style.boxShadow = '0 10px 25px rgba(0,0,0,0.2)';

            const touch = e.touches[0];
            touchDragClone.style.left = `${touch.clientX - 65}px`;
            touchDragClone.style.top = `${touch.clientY - 45}px`;

            document.body.appendChild(touchDragClone);
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (!touchDragClone) return;
            e.preventDefault();

            const touch = e.touches[0];
            touchDragClone.style.left = `${touch.clientX - 65}px`;
            touchDragClone.style.top = `${touch.clientY - 45}px`;

            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropzone = targetElement ? targetElement.closest('.dropzone') : null;

            document.querySelectorAll('.dropzone').forEach(zone => {
                zone.classList.toggle('drag-over', zone === dropzone);
            });
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (!touchDragClone) return;

            const touch = e.changedTouches[0];
            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropzone = targetElement ? targetElement.closest('.dropzone') : null;

            if (dropzone && touchDragId && quickAddsCache[touchDragId]) {
                const item = quickAddsCache[touchDragId];
                const user = dropzone.dataset.user;
                addBonus(user, item.title, item.amount, item.img || "", getTodayISO(), item.note || "");
            }

            touchDragClone.remove();
            touchDragClone = null;
            touchDragId = null;
            document.querySelectorAll('.dropzone').forEach(zone => zone.classList.remove('drag-over'));
        });

        // Quick Add Modal CRUD
        const modalQuickAdd = document.getElementById('modal-quickadd');

        document.getElementById('btn-open-quickadd-new').addEventListener('click', () => {
            document.getElementById('modal-quickadd-title').innerText = "Add Quick Button";
            document.getElementById('qa-edit-id').value = "";
            document.getElementById('qa-title').value = "";
            document.getElementById('qa-amount').value = "";
            document.getElementById('qa-note').value = "";
            qaBase64Img = "";
            qaImgFile.value = "";
            qaImgPreview.src = emptyImage;
            btnClearQaImg.style.display = 'none';
            modalQuickAdd.classList.add('active');
        });

        document.getElementById('btn-close-quickadd').addEventListener('click', () => {
            modalQuickAdd.classList.remove('active');
        });

        document.getElementById('btn-save-quickadd').addEventListener('click', () => {
            const id = document.getElementById('qa-edit-id').value;
            const title = document.getElementById('qa-title').value.trim();
            const amount = parseFloat(document.getElementById('qa-amount').value);
            const note = document.getElementById('qa-note').value.trim();

            if (!title || isNaN(amount)) {
                alert("Please enter a valid title and amount.");
                return;
            }

            const payload = { title, amount, img: qaBase64Img, note };
            if (id) {
                update(ref(db, `quickAdds/${id}`), payload);
            } else {
                push(ref(db, 'quickAdds'), payload);
            }
            modalQuickAdd.classList.remove('active');
        });

        function openEditQuickAdd(id, item) {
            document.getElementById('modal-quickadd-title').innerText = "Edit Quick Button";
            document.getElementById('qa-edit-id').value = id;
            document.getElementById('qa-title').value = item.title;
            document.getElementById('qa-amount').value = item.amount;
            document.getElementById('qa-note').value = item.note || "";

            qaBase64Img = item.img || "";
            qaImgFile.value = "";
            qaImgPreview.src = qaBase64Img || emptyImage;
            btnClearQaImg.style.display = qaBase64Img ? 'inline-block' : 'none';

            modalQuickAdd.classList.add('active');
        }

        /* -------------------------------------------
           BANKS, DRAG-DROP & BONUS ITEMS
        -------------------------------------------- */
        function renderBanksGridAndSelect(peopleNames) {
            const banksGrid = document.getElementById('banks-grid-container');
            const userSelect = document.getElementById('custom-user');

            const selectedUser = userSelect.value;
            userSelect.innerHTML = '';
            banksGrid.innerHTML = '';

            peopleNames.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                userSelect.appendChild(opt);

                const bankDiv = document.createElement('div');
                bankDiv.className = 'bank dropzone';
                bankDiv.id = `bank-${name}`;
                bankDiv.dataset.user = name;
                bankDiv.innerHTML = `
                    <div class="bank-header">
                        <button type="button" class="person-name-btn" data-user="${escapeHtml(name)}" title="Manage ${escapeHtml(name)}">${escapeHtml(name)}</button>
                        <span class="total" id="total-${name}">£0</span>
                    </div>
                    <ul class="item-list" id="list-${name}"></ul>
                `;
                banksGrid.appendChild(bankDiv);
            });

            if (peopleNames.includes(selectedUser)) userSelect.value = selectedUser;

            attachDropEvents();

            Object.values(itemsUnsubscribes).forEach(unsub => unsub());
            itemsUnsubscribes = {};

            peopleNames.forEach(name => {
                const itemsRef = ref(db, `users/${name}/items`);
                const unsub = onValue(itemsRef, (snapshot) => {
                    bankItemsCache[name] = snapshot.val() || {};
                    renderBankItems(name, bankItemsCache[name]);
                });
                itemsUnsubscribes[name] = unsub;
            });
        }

        function attachDropEvents() {
            document.querySelectorAll('.dropzone').forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    zone.classList.add('drag-over');
                });
                zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');

                    const qaId = e.dataTransfer.getData('text/plain');
                    if (qaId && quickAddsCache[qaId]) {
                        const item = quickAddsCache[qaId];
                        const user = zone.dataset.user;
                        addBonus(user, item.title, item.amount, item.img || "", getTodayISO(), item.note || "");
                    }
                });
            });
        }

        document.getElementById('banks-grid-container').addEventListener('click', (e) => {
            const personBtn = e.target.closest('.person-name-btn');
            if (personBtn) {
                openManagePerson(personBtn.dataset.user);
                return;
            }

            const editTitleBtn = e.target.closest('.item-title-btn');
            if (editTitleBtn) {
                const { user, id } = editTitleBtn.dataset;
                const item = bankItemsCache[user]?.[id];
                if (item) openEdit(user, id, item);
            }
        });

        function addBonus(user, title, amount, img, date = getTodayISO(), note = "") {
            const itemsRef = ref(db, `users/${user}/items`);
            push(itemsRef, {
                title,
                amount: parseFloat(amount),
                img: img || "",
                date: date || getTodayISO(),
                note: (note || "").trim(),
                timestamp: Date.now()
            });
        }

        function renderBankItems(user, itemsObj) {
            const listEl = document.getElementById(`list-${user}`);
            const totalEl = document.getElementById(`total-${user}`);
            if (!listEl || !totalEl) return;

            listEl.innerHTML = '';
            let total = 0;

            if (itemsObj) {
                Object.entries(itemsObj).forEach(([id, data]) => {
                    const numericAmount = parseFloat(data.amount) || 0;
                    total += numericAmount;
                    const itemImg = data.img || emptyImage;
                    const formattedDate = formatDisplayDate(data.date || getTodayISO());
                    const noteText = (data.note || "").trim();

                    const li = document.createElement('li');
                    li.className = 'item';
                    li.innerHTML = `
                        <div class="item-details">
                            <img class="item-icon" src="${itemImg}" alt="icon">
                            <div class="item-info">
                                <button type="button" class="item-title-btn" data-user="${escapeHtml(user)}" data-id="${id}" title="Click to edit or delete">${escapeHtml(data.title)}</button>
                                <span class="item-val">£${numericAmount}</span>
                                <span class="item-meta-tiny">${escapeHtml(formattedDate)}</span>
                                ${noteText ? `<span class="item-meta-tiny">${escapeHtml(noteText)}</span>` : ''}
                            </div>
                        </div>
                    `;
                    listEl.appendChild(li);
                });
            }
            totalEl.innerText = `£${total}`;
        }

        function openEdit(user, id, item) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-user').value = user;
            document.getElementById('edit-title').value = item.title;
            document.getElementById('edit-amount').value = item.amount;
            document.getElementById('edit-date').value = item.date || getTodayISO();
            document.getElementById('edit-note').value = item.note || "";

            editBase64Img = item.img || "";
            editImgFile.value = "";
            editImgPreview.src = editBase64Img || emptyImage;
            btnClearEditImg.style.display = editBase64Img ? 'inline-block' : 'none';

            document.getElementById('modal-edit').classList.add('active');
        }

        document.getElementById('btn-close-edit').addEventListener('click', () => {
            document.getElementById('modal-edit').classList.remove('active');
        });

        document.getElementById('btn-save-edit').addEventListener('click', () => {
            const user = document.getElementById('edit-user').value;
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('edit-title').value.trim();
            const amount = parseFloat(document.getElementById('edit-amount').value);
            const date = document.getElementById('edit-date').value || getTodayISO();
            const note = document.getElementById('edit-note').value.trim();

            if (!title || isNaN(amount)) {
                alert("Please enter a valid title and amount.");
                return;
            }

            update(ref(db, `users/${user}/items/${id}`), {
                title,
                amount,
                date,
                note,
                img: editBase64Img
            }).then(() => {
                document.getElementById('modal-edit').classList.remove('active');
            });
        });

        document.getElementById('btn-delete-edit-item').addEventListener('click', () => {
            const user = document.getElementById('edit-user').value;
            const id = document.getElementById('edit-id').value;
            if (confirm('Are you sure you want to delete this bonus?')) {
                remove(ref(db, `users/${user}/items/${id}`)).then(() => {
                    document.getElementById('modal-edit').classList.remove('active');
                });
            }
        });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
