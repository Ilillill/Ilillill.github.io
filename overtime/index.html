<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonus Tracker</title>
    <style>
        /* Minimalist, clean styling */
        :root {
            --bg-color: #fcfcfc;
            --surface-color: #ffffff;
            --text-main: #333333;
            --text-muted: #888888;
            --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.1);
            --accent: #4A90E2;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
        
        button {
            background: var(--surface-color);
            border: 1px solid #eee;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        button:hover { box-shadow: var(--shadow-soft); }
        
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            width: 100%;
            max-width: 1200px; 
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 1024px) {
            .banks-grid { grid-template-columns: 1fr 1fr !important; }
        }

        @media (max-width: 768px) {
            .controls-grid { grid-template-columns: 1fr; }
            .banks-grid { grid-template-columns: 1fr !important; }
        }

        .panel {
            background: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
        }

        /* Controls Panel */
        .quick-adds-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .generator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.8rem; 
            background: #fafafa;
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            cursor: grab;
            transition: all 0.2s;
            width: max-content;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .generator:active { cursor: grabbing; border-color: var(--accent); }
        
        .generator .icon-img {
            width: 24px; 
            height: 24px;
            border-radius: 4px;
            pointer-events: none;
        }

        .generator-text-title { font-weight: 600; font-size: 0.9rem; pointer-events: none; }
        .generator-text-value { color: var(--text-muted); font-size: 0.8rem; pointer-events: none; }
        
        /* Tiny action buttons inside draggable items */
        .generator-actions {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            margin-left: 0.5rem;
            border-left: 1px solid #eee;
            padding-left: 0.5rem;
        }
        .generator-actions button {
            background: none;
            border: none;
            box-shadow: none;
            padding: 0.1rem;
            font-size: 0.7rem;
            line-height: 1;
            color: var(--text-muted);
        }
        .generator-actions button:hover {
            color: var(--text-main);
            background: #ebebeb;
        }

        .icon-img { 
            width: 48px; 
            height: 48px; 
            border-radius: 8px; 
            object-fit: cover; 
            background: #fafafa; 
            border: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        
        .form-group { display: flex; flex-direction: column; gap: 0.8rem; width: 100%; }
        .row-group { display: flex; gap: 0.8rem; width: 100%; align-items: center; }
        
        input, select {
            padding: 0.8rem;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            background: #fafafa;
            width: 100%;
        }

        /* File upload styling */
        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            width: 100%;
        }
        .file-upload-btn {
            background: #f0f4f8;
            color: var(--accent);
            border: 1px dashed var(--accent);
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            flex: 1;
            transition: background 0.2s;
        }
        .file-upload-btn:hover {
            background: #e1ecf8;
        }
        input[type="file"] {
            display: none;
        }

        .btn-primary { background: var(--text-main); color: white; border: none; padding: 0.8rem; }
        .btn-primary:hover { background: #000; }
        .btn-secondary { background: var(--surface-color); padding: 0.4rem 0.8rem; font-size: 0.9rem; }
        .btn-danger { background: #ffebee; color: #c62828; border: none; padding: 0.4rem 0.8rem; font-size: 0.8rem; }
        .btn-danger:hover { background: #ffcdd2; box-shadow: none; }

        /* Banks */
        .banks-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem; 
        }
        .bank {
            background: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-soft);
            min-height: 300px;
            border: 2px solid transparent;
            transition: border 0.2s, background 0.2s;
        }
        .bank.drag-over { border-color: var(--accent); background: #f4f9ff; }
        .bank-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem; }
        .bank-header h2 { margin: 0; font-size: 1.2rem; }
        .total { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

        .item-list { list-style: none; padding: 0; margin: 0; }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .item-details { display: flex; align-items: center; gap: 1rem; }
        .item-icon { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; background: #ffffff; border: 1px solid #f0f0f0; }
        .item-info { display: flex; flex-direction: column; }
        .item-title { font-weight: 500; }
        .item-val { color: var(--text-muted); font-size: 0.9rem; }
        .item-actions button { padding: 0.3rem 0.6rem; font-size: 0.8rem; margin-left: 0.5rem; border: none; background: #f5f5f5; }
        .item-actions button:hover { background: #e0e0e0; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.2); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 10;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; padding: 2rem; border-radius: var(--border-radius);
            box-shadow: var(--shadow-hover); width: 100%; max-width: 380px;
        }
        .modal h3 { margin-top: 0; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; }
    </style>
</head>
<body>

    <header>
        <h1>Bonus Tracker</h1>
    </header>

    <div class="main-container">
        
        <div class="controls-grid">
            
            <div class="panel full-width" style="flex-direction: row; justify-content: space-between; align-items: center; padding: 1rem 1.5rem;">
                <h3 style="margin:0;">Manage People</h3>
                <div class="row-group" style="width: auto;">
                    <input type="text" id="new-person-name" placeholder="Person's Name..." style="min-width: 200px;">
                    <button class="btn-primary" id="btn-add-person" style="white-space: nowrap;">Add Person</button>
                </div>
            </div>

            <div class="panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3 style="margin:0;">Quick Add</h3>
                    <button class="btn-secondary" id="btn-open-quickadd-new">+ Add Button</button>
                </div>
                <div class="quick-adds-container" id="quick-adds-container"></div>
            </div>

            <div class="panel">
                <h3 style="margin-top:0; margin-bottom: 1rem;">Custom Bonus</h3>
                <div class="form-group">
                    <div style="display:flex; gap:1rem; align-items:center;">
                        <img id="img-custom-preview" class="icon-img" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Custom icon">
                        <input type="text" id="custom-title" placeholder="e.g. Gift, Reward">
                    </div>
                    <div class="row-group">
                        <input type="number" id="custom-amount" placeholder="Amount (£)" min="0">
                        <select id="custom-user"></select>
                    </div>
                    <div class="file-upload-wrapper">
                        <label class="file-upload-btn" for="custom-img-file">📁 Upload Icon (Stored in DB)</label>
                        <input type="file" id="custom-img-file" accept="image/*">
                        <button type="button" class="btn-secondary" id="btn-clear-custom-img" style="display:none;">Clear</button>
                    </div>
                    <button class="btn-primary" id="btn-add-custom">Add to Bank</button>
                </div>
            </div>

        </div>

        <div class="banks-grid" id="banks-grid-container"></div>
    </div>

    <!-- Edit/Create Quick Add Modal -->
    <div class="modal-overlay" id="modal-quickadd">
        <div class="modal">
            <h3 id="modal-quickadd-title">Add Quick Button</h3>
            <div class="form-group">
                <input type="hidden" id="qa-edit-id">
                <label>Title</label>
                <input type="text" id="qa-title" placeholder="e.g. Oliver's Pocket Money">
                <label>Amount (£)</label>
                <input type="number" id="qa-amount" placeholder="5">
                <label>Icon Image</label>
                <div class="file-upload-wrapper">
                    <img id="qa-img-preview" class="icon-img" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Preview">
                    <label class="file-upload-btn" for="qa-img-file">📁 Choose Image File</label>
                    <input type="file" id="qa-img-file" accept="image/*">
                    <button type="button" class="btn-secondary" id="btn-clear-qa-img" style="display:none;">Clear</button>
                </div>
            </div>
            <div class="modal-actions">
                <button id="btn-close-quickadd">Cancel</button>
                <button class="btn-primary" id="btn-save-quickadd">Save</button>
            </div>
        </div>
    </div>

    <!-- Edit Bonus Modal -->
    <div class="modal-overlay" id="modal-edit">
        <div class="modal">
            <h3>Edit Bonus</h3>
            <div class="form-group">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-user">
                <label>Title</label>
                <input type="text" id="edit-title">
                <label>Amount (£)</label>
                <input type="number" id="edit-amount">
                <label>Icon Image</label>
                <div class="file-upload-wrapper">
                    <img id="edit-img-preview" class="icon-img" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Preview">
                    <label class="file-upload-btn" for="edit-img-file">📁 Change Image</label>
                    <input type="file" id="edit-img-file" accept="image/*">
                    <button type="button" class="btn-secondary" id="btn-clear-edit-img" style="display:none;">Clear</button>
                </div>
            </div>
            <div class="modal-actions">
                <button id="btn-close-edit">Cancel</button>
                <button class="btn-primary" id="btn-save-edit">Update</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getDatabase, ref, onValue, push, set, remove, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxKv-xXahSO2TEtwVwXTfU1eJ1ZsaaMAc",
            authDomain: "tasks-de4d9.firebaseapp.com",
            databaseURL: "https://tasks-de4d9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tasks-de4d9",
            storageBucket: "tasks-de4d9.firebasestorage.app",
            messagingSenderId: "908733856196",
            appId: "1:908733856196:web:b8d268a692a0e079be4c91"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let itemsUnsubscribes = {}; 
        let quickAddsCache = {};
        let bankItemsCache = {};
        const emptyImage = "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=";

        // State holders for Base64 images
        let customBase64Img = "";
        let qaBase64Img = "";
        let editBase64Img = "";

        // DOM Elements
        const quickAddsContainer = document.getElementById('quick-adds-container');
        const customTitle = document.getElementById('custom-title');
        const customAmount = document.getElementById('custom-amount');
        const customUser = document.getElementById('custom-user');
        const customImgFile = document.getElementById('custom-img-file');
        const customImgPreview = document.getElementById('img-custom-preview');
        const btnClearCustomImg = document.getElementById('btn-clear-custom-img');

        /* -------------------------------------------
           IMAGE RESIZER & BASE64 CONVERTER
           Compresses images to 96x96 WebP/PNG so they 
           stay tiny (~3KB) inside Firebase RTDB
        -------------------------------------------- */
        function compressImageToBase64(file, maxSize = 96) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = maxSize;
                        canvas.height = maxSize;
                        const ctx = canvas.getContext('2d');

                        // Center-crop square aspect ratio
                        const minSide = Math.min(img.width, img.height);
                        const sx = (img.width - minSide) / 2;
                        const sy = (img.height - minSide) / 2;

                        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, maxSize, maxSize);
                        
                        // Export as WebP (or PNG fallback) for small file size with transparency support
                        const dataUrl = canvas.toDataURL('image/webp', 0.85);
                        resolve(dataUrl);
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Wire up Custom Bonus Image Upload
        customImgFile.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            customBase64Img = await compressImageToBase64(file);
            customImgPreview.src = customBase64Img;
            btnClearCustomImg.style.display = 'inline-block';
        });

        btnClearCustomImg.addEventListener('click', () => {
            customBase64Img = "";
            customImgFile.value = "";
            customImgPreview.src = emptyImage;
            btnClearCustomImg.style.display = 'none';
        });

        // Wire up Quick Add Image Upload
        const qaImgFile = document.getElementById('qa-img-file');
        const qaImgPreview = document.getElementById('qa-img-preview');
        const btnClearQaImg = document.getElementById('btn-clear-qa-img');

        qaImgFile.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            qaBase64Img = await compressImageToBase64(file);
            qaImgPreview.src = qaBase64Img;
            btnClearQaImg.style.display = 'inline-block';
        });

        btnClearQaImg.addEventListener('click', () => {
            qaBase64Img = "";
            qaImgFile.value = "";
            qaImgPreview.src = emptyImage;
            btnClearQaImg.style.display = 'none';
        });

        // Wire up Edit Bonus Image Upload
        const editImgFile = document.getElementById('edit-img-file');
        const editImgPreview = document.getElementById('edit-img-preview');
        const btnClearEditImg = document.getElementById('btn-clear-edit-img');

        editImgFile.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            editBase64Img = await compressImageToBase64(file);
            editImgPreview.src = editBase64Img;
            btnClearEditImg.style.display = 'inline-block';
        });

        btnClearEditImg.addEventListener('click', () => {
            editBase64Img = "";
            editImgFile.value = "";
            editImgPreview.src = emptyImage;
            btnClearEditImg.style.display = 'none';
        });

        /* -------------------------------------------
           FIREBASE INITIALIZATION
        -------------------------------------------- */
        signInAnonymously(auth).then(() => {
            initApp();
        }).catch((error) => {
            console.error("Auth Error:", error);
            alert("Authentication failed. Check console.");
        });

        function initApp() {
            onValue(ref(db, 'quickAdds'), (snapshot) => {
                quickAddsCache = snapshot.val() || {};
                renderQuickAdds(quickAddsCache);
            });

            get(ref(db, 'users')).then(snap => {
                const existingUsers = snap.val() || {};
                const names = Object.keys(existingUsers);
                if (names.length > 0) {
                    names.forEach(n => set(ref(db, `people/${n}`), true));
                } else {
                    set(ref(db, 'people/Christopher'), true);
                    set(ref(db, 'people/Renata'), true);
                }
            });

            onValue(ref(db, 'people'), (snapshot) => {
                const peopleObj = snapshot.val() || {};
                const peopleNames = Object.keys(peopleObj);
                renderBanksGridAndSelect(peopleNames);
            });
        }

        /* -----------------------
           QUICK ADDS LOGIC
        ------------------------ */
        function renderQuickAdds(data) {
            quickAddsContainer.innerHTML = '';
            if (!data) return;

            Object.entries(data).forEach(([id, item]) => {
                const imgUrl = item.img || emptyImage;
                
                const div = document.createElement('div');
                div.className = 'generator draggable';
                div.draggable = true;
                div.dataset.id = id;

                div.innerHTML = `
                    <img class="icon-img" src="${imgUrl}" alt="icon">
                    <div>
                        <div class="generator-text-title">${escapeHtml(item.title)}</div>
                        <div class="generator-text-value">£${item.amount}</div>
                    </div>
                    <div class="generator-actions">
                        <button class="btn-edit-qa" data-id="${id}" title="Edit">✏️</button>
                        <button class="btn-del-qa" data-id="${id}" title="Delete">✕</button>
                    </div>
                `;
                quickAddsContainer.appendChild(div);
            });
        }

        // Event delegation for Quick Add edit/delete buttons
        quickAddsContainer.addEventListener('click', (e) => {
            const editBtn = e.target.closest('.btn-edit-qa');
            if (editBtn) {
                e.stopPropagation();
                const id = editBtn.dataset.id;
                const item = quickAddsCache[id];
                if (item) openEditQuickAdd(id, item);
                return;
            }

            const delBtn = e.target.closest('.btn-del-qa');
            if (delBtn) {
                e.stopPropagation();
                const id = delBtn.dataset.id;
                if (confirm("Delete this Quick Add template?")) {
                    remove(ref(db, `quickAdds/${id}`));
                }
            }
        });

        /* -------------------------------------------
           DESKTOP DRAG & MOBILE TOUCH IMPLEMENTATION
        -------------------------------------------- */
        let touchDragId = null;
        let touchDragClone = null;

        quickAddsContainer.addEventListener('dragstart', (e) => {
            const generator = e.target.closest('.generator');
            if (generator) {
                e.dataTransfer.setData('text/plain', generator.dataset.id);
                e.dataTransfer.effectAllowed = 'copy';
            }
        });

        quickAddsContainer.addEventListener('touchstart', (e) => {
            if (e.target.closest('.generator-actions')) return;

            const generator = e.target.closest('.generator');
            if (!generator) return;

            touchDragId = generator.dataset.id;

            touchDragClone = generator.cloneNode(true);
            touchDragClone.style.position = 'fixed';
            touchDragClone.style.pointerEvents = 'none';
            touchDragClone.style.zIndex = '9999';
            touchDragClone.style.opacity = '0.85';
            touchDragClone.style.transform = 'scale(1.05)';
            touchDragClone.style.boxShadow = '0 10px 25px rgba(0,0,0,0.2)';

            const touch = e.touches[0];
            touchDragClone.style.left = `${touch.clientX - 40}px`;
            touchDragClone.style.top = `${touch.clientY - 40}px`;

            document.body.appendChild(touchDragClone);
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (!touchDragClone) return;
            e.preventDefault();

            const touch = e.touches[0];
            touchDragClone.style.left = `${touch.clientX - 40}px`;
            touchDragClone.style.top = `${touch.clientY - 40}px`;

            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropzone = targetElement ? targetElement.closest('.dropzone') : null;

            document.querySelectorAll('.dropzone').forEach(zone => {
                zone.classList.toggle('drag-over', zone === dropzone);
            });
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (!touchDragClone) return;

            const touch = e.changedTouches[0];
            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropzone = targetElement ? targetElement.closest('.dropzone') : null;

            if (dropzone && touchDragId && quickAddsCache[touchDragId]) {
                const item = quickAddsCache[touchDragId];
                const user = dropzone.dataset.user;
                addBonus(user, item.title, item.amount, item.img || "");
            }

            touchDragClone.remove();
            touchDragClone = null;
            touchDragId = null;
            document.querySelectorAll('.dropzone').forEach(zone => zone.classList.remove('drag-over'));
        });

        // Quick Add Modals & CRUD
        const modalQuickAdd = document.getElementById('modal-quickadd');
        
        document.getElementById('btn-open-quickadd-new').addEventListener('click', () => {
            document.getElementById('modal-quickadd-title').innerText = "Add Quick Button";
            document.getElementById('qa-edit-id').value = "";
            document.getElementById('qa-title').value = "";
            document.getElementById('qa-amount').value = "";
            qaBase64Img = "";
            qaImgFile.value = "";
            qaImgPreview.src = emptyImage;
            btnClearQaImg.style.display = 'none';
            modalQuickAdd.classList.add('active');
        });

        document.getElementById('btn-close-quickadd').addEventListener('click', () => {
            modalQuickAdd.classList.remove('active');
        });

        document.getElementById('btn-save-quickadd').addEventListener('click', () => {
            const id = document.getElementById('qa-edit-id').value;
            const title = document.getElementById('qa-title').value.trim();
            const amount = parseFloat(document.getElementById('qa-amount').value);

            if (!title || isNaN(amount)) {
                alert("Please enter a valid title and amount.");
                return;
            }

            if (id) {
                update(ref(db, `quickAdds/${id}`), { title, amount, img: qaBase64Img });
            } else {
                push(ref(db, 'quickAdds'), { title, amount, img: qaBase64Img });
            }
            modalQuickAdd.classList.remove('active');
        });

        function openEditQuickAdd(id, item) {
            document.getElementById('modal-quickadd-title').innerText = "Edit Quick Button";
            document.getElementById('qa-edit-id').value = id;
            document.getElementById('qa-title').value = item.title;
            document.getElementById('qa-amount').value = item.amount;
            
            qaBase64Img = item.img || "";
            qaImgFile.value = "";
            qaImgPreview.src = qaBase64Img || emptyImage;
            btnClearQaImg.style.display = qaBase64Img ? 'inline-block' : 'none';
            
            modalQuickAdd.classList.add('active');
        }

        /* -----------------------
           BANKS & DROP LOGIC
        ------------------------ */
        function renderBanksGridAndSelect(peopleNames) {
            const banksGrid = document.getElementById('banks-grid-container');
            const userSelect = document.getElementById('custom-user');
            
            const selectedUser = userSelect.value;
            userSelect.innerHTML = '';
            banksGrid.innerHTML = '';
            
            peopleNames.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                userSelect.appendChild(opt);

                const bankDiv = document.createElement('div');
                bankDiv.className = 'bank dropzone';
                bankDiv.id = `bank-${name}`;
                bankDiv.dataset.user = name;
                bankDiv.innerHTML = `
                    <div class="bank-header">
                        <h2>${escapeHtml(name)}</h2>
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <span class="total" id="total-${name}">£0</span>
                            <button class="btn-danger btn-del-person" data-user="${escapeHtml(name)}">Delete</button>
                        </div>
                    </div>
                    <ul class="item-list" id="list-${name}"></ul>
                `;
                banksGrid.appendChild(bankDiv);
            });

            if (peopleNames.includes(selectedUser)) userSelect.value = selectedUser;

            attachDropEvents();

            Object.values(itemsUnsubscribes).forEach(unsub => unsub());
            itemsUnsubscribes = {};

            peopleNames.forEach(name => {
                const itemsRef = ref(db, `users/${name}/items`);
                const unsub = onValue(itemsRef, (snapshot) => {
                    bankItemsCache[name] = snapshot.val() || {};
                    renderBankItems(name, bankItemsCache[name]);
                });
                itemsUnsubscribes[name] = unsub;
            });
        }

        function attachDropEvents() {
            document.querySelectorAll('.dropzone').forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    zone.classList.add('drag-over');
                });
                zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                    
                    const qaId = e.dataTransfer.getData('text/plain');
                    if (qaId && quickAddsCache[qaId]) {
                        const item = quickAddsCache[qaId];
                        const user = zone.dataset.user;
                        addBonus(user, item.title, item.amount, item.img || "");
                    }
                });
            });
        }

        // Event delegation for bank actions (Edit item, Delete item, Delete person)
        document.getElementById('banks-grid-container').addEventListener('click', (e) => {
            const delPersonBtn = e.target.closest('.btn-del-person');
            if (delPersonBtn) {
                const name = delPersonBtn.dataset.user;
                if (confirm(`Are you sure you want to completely remove ${name} and all their bonuses?`)) {
                    remove(ref(db, `people/${name}`));
                    remove(ref(db, `users/${name}`));
                }
                return;
            }

            const editItemBtn = e.target.closest('.btn-edit-item');
            if (editItemBtn) {
                const { user, id } = editItemBtn.dataset;
                const item = bankItemsCache[user]?.[id];
                if (item) openEdit(user, id, item);
                return;
            }

            const delItemBtn = e.target.closest('.btn-del-item');
            if (delItemBtn) {
                const { user, id } = delItemBtn.dataset;
                if (confirm('Are you sure you want to delete this?')) {
                    remove(ref(db, `users/${user}/items/${id}`));
                }
            }
        });

        document.getElementById('btn-add-person').addEventListener('click', () => {
            const nameInput = document.getElementById('new-person-name');
            const name = nameInput.value.trim();
            if (name) {
                set(ref(db, `people/${name}`), true);
                nameInput.value = '';
            }
        });

        document.getElementById('btn-add-custom').addEventListener('click', () => {
            const title = customTitle.value.trim();
            const amount = parseFloat(customAmount.value);
            const user = customUser.value;

            if (title && !isNaN(amount) && user) {
                addBonus(user, title, amount, customBase64Img);
                customTitle.value = ''; 
                customAmount.value = '';
                customBase64Img = '';
                customImgFile.value = '';
                customImgPreview.src = emptyImage;
                btnClearCustomImg.style.display = 'none';
            } else {
                alert("Please ensure title, amount, and user are selected.");
            }
        });

        function addBonus(user, title, amount, img) {
            const itemsRef = ref(db, `users/${user}/items`);
            push(itemsRef, { 
                title, 
                amount: parseFloat(amount), 
                img: img || "", 
                timestamp: Date.now() 
            });
        }

        function renderBankItems(user, itemsObj) {
            const listEl = document.getElementById(`list-${user}`);
            const totalEl = document.getElementById(`total-${user}`);
            if (!listEl || !totalEl) return; 
            
            listEl.innerHTML = '';
            let total = 0;
            
            if (itemsObj) {
                Object.entries(itemsObj).forEach(([id, data]) => {
                    total += data.amount;
                    const itemImg = data.img || emptyImage;
                    const li = document.createElement('li');
                    li.className = 'item';
                    li.innerHTML = `
                        <div class="item-details">
                            <img class="item-icon" src="${itemImg}" alt="icon">
                            <div class="item-info">
                                <span class="item-title">${escapeHtml(data.title)}</span>
                                <span class="item-val">£${data.amount}</span>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit-item" data-user="${escapeHtml(user)}" data-id="${id}">Edit</button>
                            <button class="btn-del-item" data-user="${escapeHtml(user)}" data-id="${id}">✕</button>
                        </div>
                    `;
                    listEl.appendChild(li);
                });
            }
            totalEl.innerText = `£${total}`;
        }
        
        function openEdit(user, id, item) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-user').value = user;
            document.getElementById('edit-title').value = item.title;
            document.getElementById('edit-amount').value = item.amount;

            editBase64Img = item.img || "";
            editImgFile.value = "";
            editImgPreview.src = editBase64Img || emptyImage;
            btnClearEditImg.style.display = editBase64Img ? 'inline-block' : 'none';

            document.getElementById('modal-edit').classList.add('active');
        }

        document.getElementById('btn-close-edit').addEventListener('click', () => document.getElementById('modal-edit').classList.remove('active'));
        document.getElementById('btn-save-edit').addEventListener('click', () => {
            const user = document.getElementById('edit-user').value;
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('edit-title').value.trim();
            const amount = parseFloat(document.getElementById('edit-amount').value);
            
            update(ref(db, `users/${user}/items/${id}`), { 
                title, 
                amount,
                img: editBase64Img
            }).then(() => {
                document.getElementById('modal-edit').classList.remove('active');
            });
        });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
